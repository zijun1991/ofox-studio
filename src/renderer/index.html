<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src blob: *; script-src 'self' 'unsafe-eval' 'unsafe-inline' *; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' *; font-src 'self' data: *; img-src 'self' data: file: * blob:; media-src 'self' file:; frame-src * file:" />
    <title>Ofox Claw</title>

    <style>
      html,
      body {
        margin: 0;
      }

      @keyframes flipX {
        0% { transform: perspective(400px) rotateY(0deg); }
        50% { transform: perspective(400px) rotateY(180deg); }
        100% { transform: perspective(400px) rotateY(360deg); }
      }

      #spinner {
        position: fixed;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        display: flex;
        gap: 24px;
        background: #ffffff;
        z-index: 9999;
      }

      #spinner img {
        width: 100px;
        border-radius: 50px;
        animation: flipX 2s ease-in-out infinite;
      }

      #spinner .app-name {
        font-size: 28px;
        font-weight: 700;
        color: #B07353;
        letter-spacing: 2px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="spinner">
      <img src="/src/assets/images/logo.png" />
      <div class="app-name">Ofox Claw</div>
    </div>
    <script>
      console.time('init')
    </script>
    <script type="module" src="/src/init.ts"></script>
    <script type="module" src="/src/entryPoint.tsx"></script>
  </body>
</html>
